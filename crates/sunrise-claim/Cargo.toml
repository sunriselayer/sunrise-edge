[package]
name = "sunrise-claim"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rise-claim"
path = "src/bin/rise-claim.rs"

[dependencies]
bech32 = "=0.11.0"
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
ripemd = "=0.1.3"
digest010 = { package = "digest", version = "=0.10.7" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2.workspace = true

[dev-dependencies]
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
ripemd = "=0.1.3"
digest010 = { package = "digest", version = "=0.10.7" }
sha2.workspace = true
