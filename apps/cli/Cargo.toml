[package]
name = "sunrise-edge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sunrise_edge_cli"
path = "src/lib.rs"

[[bin]]
name = "sunrise-edge-cli"
path = "src/main.rs"

[dependencies]
protocol-types.workspace = true
sunrise-edge-client.workspace = true
sunrise-edge-ledger.workspace = true
public-standard-asset = { path = "../../contracts/standard-asset" }
# `fastvote-drain-local-ready` needs `FrozenFrontierVote`/`decode_frozen_frontier_vote`
# and friends directly: `sunrise-edge-client` re-exports its `fastvote_drain_driver`
# module (whose public signatures already reference these types) but never
# re-exports the `consensus`/`hashing` items themselves. Both already resolved
# transitively for this crate via `[dev-dependencies]` below, so promoting them
# here does not change `Cargo.lock`.
consensus.workspace = true
hashing.workspace = true

[features]
default = []
# Enables a real Ledger USB/HID transport for `--ledger-hid-path`. Off by
# default; see `sunrise-edge-ledger`'s `usb-hid` feature and `src/signer.rs`.
usb-hid = ["sunrise-edge-ledger/usb-hid"]

[dev-dependencies]
abi.workspace = true
crypto.workspace = true
execution.workspace = true
fees.workspace = true
native-http.workspace = true
node-core.workspace = true
objects.workspace = true
protocol-types.workspace = true
rcgen.workspace = true
runtime.workspace = true
wat.workspace = true
rustls.workspace = true
sunrise-edge-devnet.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
