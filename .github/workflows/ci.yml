name: repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Omit symbols/incremental artifacts, never assertions or tests.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Run repository gate
        run: ./scripts/check-all.sh --group lint

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group rust-tests

  portable-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4

      - name: Run repository gate
        run: ./scripts/check-all.sh --group portable-tools

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: adapters/cloudflare-workers/package-lock.json

      - name: Install Cloudflare adapter dependencies
        run: npm ci --prefix adapters/cloudflare-workers

      - name: Install embedded validator build tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Run repository gate
        run: ./scripts/check-all.sh --group cloudflare

  core-recurrence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group core-recurrence

  readiness-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group readiness-sqlite

  recurring-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group recurring-sqlite

  # Stable branch-protection name: no failed, cancelled, missing or skipped
  # lane can become success through needs/if defaults.
  check:
    if: ${{ always() }}
    needs:
      - lint
      - rust-tests
      - portable-tools
      - cloudflare
      - core-recurrence
      - readiness-sqlite
      - recurring-sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Require every repository gate to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
