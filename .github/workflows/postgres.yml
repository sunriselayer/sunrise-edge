name: postgres checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Omit symbols/incremental artifacts, never assertions or tests.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  pg-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This disposable service belongs only to this runner.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sunrise_edge_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunrise_edge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUNRISE_EDGE_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/sunrise_edge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        env:
          SUNRISE_EDGE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          SUNRISE_EDGE_TEST_POSTGRES_CRASH_REQUIRED: "1"
          SUNRISE_EDGE_TEST_POSTGRES_DISK_FULL_IMAGE: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          SUNRISE_EDGE_TEST_POSTGRES_DISK_FULL_REQUIRED: "1"
          SUNRISE_EDGE_TEST_POSTGRES_WAL_FULL_IMAGE: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          SUNRISE_EDGE_TEST_POSTGRES_WAL_FULL_REQUIRED: "1"
          SUNRISE_EDGE_TEST_POSTGRES_CONNECTION_EXHAUSTION_IMAGE: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          SUNRISE_EDGE_TEST_POSTGRES_CONNECTION_EXHAUSTION_REQUIRED: "1"
          SUNRISE_EDGE_TEST_POSTGRES_BACKUP_RESTORE_IMAGE: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          SUNRISE_EDGE_TEST_POSTGRES_BACKUP_RESTORE_REQUIRED: "1"
          SUNRISE_EDGE_TEST_POSTGRES_PGBOUNCER_POSTGRES_IMAGE: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          SUNRISE_EDGE_TEST_POSTGRES_PGBOUNCER_IMAGE: ghcr.io/icoretech/pgbouncer-docker:1.25.2@sha256:53dc42879de6b87efed6ad239558cfa6fef6f08c5fa4acc109da5f5af1868b89
          SUNRISE_EDGE_TEST_POSTGRES_PGBOUNCER_REQUIRED: "1"
        run: ./scripts/check-all.sh --group pg-storage

  pg-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This disposable service belongs only to this runner.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sunrise_edge_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunrise_edge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUNRISE_EDGE_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/sunrise_edge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group pg-lifecycle

  pg-drain-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This disposable service belongs only to this runner.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sunrise_edge_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunrise_edge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUNRISE_EDGE_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/sunrise_edge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group pg-drain-history

  pg-business-audit:
    runs-on: ubuntu-latest
    # Provisional independent-lane budget, not a measured audit completion time.
    timeout-minutes: 90
    # This disposable service belongs only to this runner.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sunrise_edge_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunrise_edge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUNRISE_EDGE_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/sunrise_edge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group pg-business-audit

  pg-recovery-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This disposable service belongs only to this runner.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: sunrise_edge_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunrise_edge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUNRISE_EDGE_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/sunrise_edge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository gate
        run: ./scripts/check-all.sh --group pg-recovery-economics

  # Explicit PostgreSQL acceptance succeeds only when all five lanes succeed.
  postgres-check:
    if: ${{ always() }}
    needs:
      - pg-storage
      - pg-lifecycle
      - pg-drain-history
      - pg-business-audit
      - pg-recovery-economics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Require every repository gate to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs --profile postgres
